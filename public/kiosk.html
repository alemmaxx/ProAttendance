<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProAttendance</title>
  <meta name="theme-color" content="#1d4ed8">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <style>
    .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:360px;margin:0 auto}
    .kpad button{font-size:1.6rem;font-weight:700;padding:1rem 0;border-radius:14px;border:0;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
    .kpad button:active{background:rgba(255,255,255,.3)}
    .kfield{background:#fff;color:#0f172a;border-radius:14px;padding:.8rem 1rem;font-size:1.6rem;font-weight:800;letter-spacing:.15em;min-height:3.2rem;text-align:center;max-width:360px;margin:0 auto .6rem}
    .kfield.on{outline:4px solid #fde047}
    .klabel{font-size:.85rem;opacity:.85;margin-bottom:.3rem}
  </style>
</head>
<body>
  <div id="app"><div class="loader"><span class="spin"></span></div></div>
  <script type="module" src="/js/kiosk.js"></script>
</body>
</html>
