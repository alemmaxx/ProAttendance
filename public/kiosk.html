<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProAttendance</title>
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <style>
    .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:360px;margin:0 auto}
    .kpad button{font-size:1.6rem;font-weight:700;padding:1rem 0;border-radius:14px;border:0;background:var(--soft2);color:var(--ink);cursor:pointer;font-family:var(--f)}
    .kpad button:active{background:var(--gold2);color:var(--gold)}
    .kfield{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:.8rem 1rem;font-size:1.6rem;font-weight:800;letter-spacing:.15em;min-height:3.2rem;text-align:center;max-width:360px;margin:0 auto .6rem}
    .kfield.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold2)}
    .klabel{font-size:.85rem;opacity:.85;margin-bottom:.3rem}
  </style>
</head>
<body>
  <div id="app"><div class="loader"><span class="spin"></span></div></div>
  <script type="module" src="/js/kiosk.js"></script>
</body>
</html>
