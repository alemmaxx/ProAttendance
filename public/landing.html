<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProAttendance — Sistem Kehadiran & Gaji Pekerja</title>
  <meta name="description" content="Sistem kehadiran pekerja online: punch guna telefon (GPS, QR, selfie), cuti & OT online, gaji & slip gaji automatik. Cuba percuma.">
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .hero{position:relative;padding:2rem 1.2rem 4rem;text-align:center;overflow:hidden;isolation:isolate}
    .hero::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(120% 80% at 85% 10%,#1c2f52 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#2a2210 0%,transparent 60%),var(--bg)}
    .hero::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--star) 0 0/56px;opacity:.07;mask-image:linear-gradient(180deg,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 85%)}
    .hero h1{font-size:clamp(2.2rem,7vw,4rem);max-width:900px;margin:0 auto .8rem}
    .hero p{font-size:1.1rem;opacity:.88;max-width:640px;margin:0 auto 1.6rem}
    .hero .tag{color:var(--gold);font-weight:700;font-size:14px;margin-bottom:.4rem}
    .nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 3rem}
    .nav b{display:flex;align-items:center;gap:.5rem;font-size:1.15rem;font-weight:800}
    .nav b .ic{color:var(--gold)}
    .sec{max-width:1100px;margin:0 auto;padding:3rem 1.2rem}
    .sec h2{text-align:center;font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:.4rem}
    .sub{text-align:center;color:var(--muted);margin-bottom:2rem}
    .feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .feat .card{margin:0;border-left:3px solid var(--gold)}
    .feat .ico{width:46px;height:46px;border-radius:12px;background:var(--gold2);color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:.6rem}
    .cta{display:inline-flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
    .btn-xl{padding:14px 26px;font-size:1.05rem;border-radius:10px}
    .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;counter-reset:s}
    .steps div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.2rem 1.2rem;position:relative}
    .steps div:before{counter-increment:s;content:counter(s);position:absolute;top:-13px;left:14px;background:var(--gold);color:#1b1503;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800}
    .faq details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
    .faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
    .faq summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}.faq details[open] summary::after{content:"–"}
    footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:2rem 1rem;font-size:.85rem}
    .wa-float{position:fixed;right:18px;bottom:18px;background:#25d366;color:#06291a;border-radius:50px;padding:.8rem 1.1rem;font-weight:800;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { db } from '/js/fb.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { $, $$, L, esc, money, icon, langBtn, applyLang } from '/js/ui.js';

    const ref = new URLSearchParams(location.search).get('ref');
    if (ref) { try { localStorage.setItem('pa_ref', ref.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20)); } catch {} }
    let P = {};
    try { const s = await getDoc(doc(db, 'config', 'plans')); P = s.exists() ? s.data() : {}; } catch {}

    function render() {
      const td = P.trialDays ?? 14;
      const reg = '/admin.html?register=1';
      const wa = P.salesPhone ? `https://wa.me/${P.salesPhone}?text=${encodeURIComponent(L('Salam, saya berminat dengan ProAttendance.', 'Hi, I am interested in ProAttendance.'))}` : '';
      const plans = [['monthly', L('Bulanan', 'Monthly'), 1], ['sixMonth', L('6 Bulan', '6 Months'), 6], ['yearly', L('Tahunan', 'Yearly'), 12]].filter(x => Number(P[x[0]]) > 0);
      const F = [
        ['clock', L('Punch guna telefon', 'Punch from any phone'), L('Butang, GPS + geofence, atau kod QR yang bertukar setiap 30 saat. Selfie sebagai bukti.', 'Button, GPS + geofence, or a QR code that changes every 30 seconds. Selfie as proof.')],
        ['building', L('Mod kiosk tablet', 'Tablet kiosk mode'), L('Satu tablet di pintu masuk — pekerja punch dengan ID + PIN atau kad QR.', 'One tablet at the entrance — staff punch with ID + PIN or a QR card.')],
        ['cal', L('Syif, cuti & MC', 'Shifts, leave & MC'), L('Jadual syif mingguan, permohonan cuti/MC dengan gambar, baki cuti automatik, cuti umum.', 'Weekly rosters, leave/MC requests with photos, automatic balances, public holidays.')],
        ['check', L('Kelulusan sekali tekan', 'One-tap approvals'), L('Cuti, OT, pembetulan punch, tuntutan & pendahuluan gaji — semua di satu tempat.', 'Leave, OT, punch corrections, claims & salary advances — all in one place.')],
        ['money', L('Gaji & slip gaji', 'Payroll & payslips'), L('Kira gaji, OT, elaun (+), potongan, KWSP/PERKESO/SIP (kadar anda isi sendiri). Slip PDF & fail bank.', 'Calculate pay, OT, allowances (+), deductions, EPF/SOCSO/EIS (your own rates). PDF slips & bank file.')],
        ['chart', L('Laporan & Excel', 'Reports & Excel'), L('Kehadiran, lewat, tidak hadir, OT — muat turun Excel atau cetak PDF.', 'Attendance, lateness, absences, OT — download Excel or print PDF.')],
        ['shield', L('Fail HR lengkap', 'Complete HR files'), L('Dokumen dengan peringatan tamat, amaran, prestasi, aset, pinjaman pekerja.', 'Documents with expiry reminders, warnings, reviews, assets, staff loans.')],
        ['users', L('Jenama syarikat anda', 'Your own branding'), L('Nama & logo syarikat anda dipaparkan kepada pekerja. Dwibahasa BM | EN.', 'Your company name & logo shown to staff. Bilingual BM | EN.')]
      ];
      $('#app').innerHTML = `
      <section class="hero">
        <div class="nav"><b style="display:flex;align-items:center;gap:10px"><img src="/icon.svg" alt="" width="30" height="30"> ProAttendance</b><div class="row">${langBtn()}<a class="btn btn-sm btn-ghost" href="/admin.html">${L('Log Masuk', 'Log In')}</a></div></div>
        <div class="tag">✦ ${L('Kehadiran · Cuti · OT · Gaji', 'Attendance · Leave · OT · Payroll')}</div>
        <h1 class="gold-h">${L('Kehadiran pekerja, terus dari telefon.', 'Staff attendance, right from the phone.')}</h1>
        <p>${L('Tiada lagi buku log dan "punch kan kawan". Pekerja punch dengan GPS, QR atau selfie; anda nampak semuanya secara langsung dan gaji dikira sendiri.', 'No more logbooks or buddy punching. Staff punch with GPS, QR or selfie; you see everything live and payroll calculates itself.')}</p>
        <div class="cta"><a class="btn btn-primary btn-xl" href="${reg}">${L(`Cuba Percuma ${td} Hari`, `Free ${td}-Day Trial`)}</a>
          ${wa ? `<a class="btn btn-xl" style="background:#25d366;color:#06291a" href="${wa}" target="_blank">${icon('chat', 20)} WhatsApp</a>` : ''}</div>
        <p class="small" style="margin-top:1rem;opacity:.75">${L('Tiada kad kredit diperlukan · Setup 5 minit · Bahasa Melayu', 'No credit card needed · 5-minute setup · Bahasa Melayu')}</p>
      </section>
      <section class="sec">
        <h2 class="gold-h">${L('Semua yang bisnes anda perlukan.', 'Everything your business needs.')}</h2>
        <p class="sub">${L('Sesuai untuk kedai, restoran, kilang, kontraktor, katering & pejabat kecil.', 'Ideal for shops, restaurants, factories, contractors, caterers & small offices.')}</p>
        <div class="feat">${F.map(([i, t, d]) => `<div class="card"><div class="ico">${icon(i, 24)}</div><h3>${t}</h3><p class="small muted">${d}</p></div>`).join('')}</div>
      </section>
      <section class="sec" style="max-width:none">
        <div style="max-width:1100px;margin:0 auto">
          <h2 class="gold-h">${L('Mula dalam 3 langkah.', 'Start in 3 steps.')}</h2><p class="sub"></p>
          <div class="steps">
            <div><b>${L('Daftar syarikat', 'Register your company')}</b><p class="small muted">${L('Isi nama syarikat & kod. Muat naik logo.', 'Enter company name & code. Upload your logo.')}</p></div>
            <div><b>${L('Tambah lokasi & pekerja', 'Add locations & staff')}</b><p class="small muted">${L('Sistem jana ID & PIN — hantar terus melalui WhatsApp.', 'The system creates IDs & PINs — send them via WhatsApp.')}</p></div>
            <div><b>${L('Pekerja mula punch', 'Staff start punching')}</b><p class="small muted">${L('Buka pautan di telefon, tiada install diperlukan.', 'Open the link on their phone — no install needed.')}</p></div>
          </div>
        </div>
      </section>
      <section class="sec">
        <h2 class="gold-h">${L('Harga mudah.', 'Simple pricing.')}</h2>
        <p class="sub">${L('Satu harga untuk satu syarikat. Cuba percuma dahulu.', 'One price per company. Try it free first.')}</p>
        ${plans.length ? `<div class="plans" style="max-width:820px;margin:0 auto">${plans.map(([k, t, m], i) => `
          <div class="plan ${i === plans.length - 1 ? 'best' : ''}">${i === plans.length - 1 && plans.length > 1 ? `<span class="badge b-brand">${L('Paling jimat', 'Best value')}</span>` : ''}
            <div class="bold" style="margin-top:.3rem">${t}</div><div class="price">${money(P[k])}</div>
            <div class="xs muted">≈ ${money(P[k] / m)} / ${L('bulan', 'month')}</div>
            <a class="btn btn-primary btn-block" style="margin-top:.8rem" href="${reg}">${L('Cuba Percuma', 'Try Free')}</a></div>`).join('')}</div>` : ''}
      </section>
      <section class="sec faq" style="max-width:760px">
        <h2 class="gold-h">${L('Soalan lazim.', 'FAQ.')}</h2><p class="sub"></p>
        ${[
          [L('Adakah pekerja perlu install app?', 'Do staff need to install an app?'), L('Tidak. Pekerja hanya buka pautan di pelayar telefon. Mereka boleh "Add to Home Screen" untuk guna seperti app.', 'No. Staff just open the link in their phone browser, and can "Add to Home Screen" to use it like an app.')],
          [L('Bagaimana elak pekerja punch untuk kawan?', 'How do you prevent buddy punching?'), L('Gabungan selfie, GPS dengan had radius, QR yang bertukar setiap 30 saat, dan pilihan satu telefon seorang pekerja.', 'A combination of selfies, GPS with a radius limit, a QR code that changes every 30 seconds, and an optional one-phone-per-staff lock.')],
          [L('Adakah kadar KWSP / PERKESO dikira automatik?', 'Are EPF / SOCSO rates automatic?'), L('Anda masukkan kadar atau amaun sendiri ikut jadual rasmi terkini; sistem akan mengira dan semua angka boleh disunting sebelum slip diterbitkan.', 'You enter the rates or amounts yourself from the latest official tables; the system calculates and every figure is editable before slips are published.')],
          [L('Bagaimana jika tiada internet?', 'What if there is no internet?'), L('Punch disimpan dalam telefon dan dihantar secara automatik bila talian pulih.', 'Punches are saved on the phone and sent automatically when the connection returns.')],
          [L('Boleh batal bila-bila masa?', 'Can I cancel any time?'), L('Ya. Tiada kontrak — langganan hanya tidak diperbaharui.', 'Yes. No contract — simply do not renew.')]
        ].map(([q, a]) => `<details><summary>${q}</summary><p class="muted">${a}</p></details>`).join('')}
        <div class="center" style="margin-top:2rem"><a class="btn btn-primary btn-xl" href="${reg}">${L(`Mula Percubaan Percuma ${td} Hari`, `Start ${td}-Day Free Trial`)}</a></div>
      </section>
      <footer>© ${new Date().getFullYear()} ProAttendance · <a href="/">${L('Log masuk majikan', 'Employer login')}</a> · <a href="/privasi.html">${L('Terma & Privasi', 'Terms & Privacy')}</a></footer>
      ${wa ? `<a class="wa-float" style="display:inline-flex;gap:.4rem;align-items:center" href="${wa}" target="_blank">${icon('chat', 18)} WhatsApp</a>` : ''}`;
      applyLang();
    }
    render();
    document.addEventListener('langchange', render);
  </script>
</body>
</html>
